name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
      # generate (and fail on stale generated files), lint, gosec, tests
      # with -race and the coverage gate.
      - run: make check

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make vuln

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: takt:ci
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm takt:ci version
          docker run -d --name takt -p 8088:8088 -p 9090:9090 takt:ci dev
          for i in $(seq 30); do curl -sf localhost:9090/healthz && break; sleep 1; done
          curl -sf localhost:9090/metrics | grep -q go_goroutines
          curl -sf -o /dev/null localhost:8088/domains
          test "$(docker inspect takt --format '{{.Config.User}}')" = "65532:65532"
          docker rm -f takt
      - name: Save image
        run: docker save takt:ci -o takt-image.tar
      - uses: actions/upload-artifact@v7
        with:
          name: takt-image
          path: takt-image.tar
          retention-days: 1

  helm:
    name: helm chart
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint
        run: |
          helm lint charts/takt --strict
          helm lint charts/takt --strict --set embeddedNats.enabled=true,replicaCount=1
          helm template t charts/takt \
            --set autoscaling.enabled=true,podDisruptionBudget.enabled=true \
            --set metrics.serviceMonitor.enabled=true,ingress.enabled=true \
            --set nats.credentials.existingSecret=nats-creds \
            --set 'imagePullSecrets[0].name=registry' > /dev/null
          if helm template t charts/takt --set embeddedNats.enabled=true > /dev/null 2>&1; then
            echo "embeddedNats with 2 replicas should fail"; exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: takt-image
      - uses: helm/kind-action@v1
        with:
          cluster_name: takt
      - name: Install chart against NATS
        run: |
          kind load image-archive takt-image.tar --name takt
          kubectl apply -f charts/takt/ci/nats.yaml
          kubectl rollout status deploy/nats --timeout=180s
          helm install takt charts/takt -f charts/takt/ci/kind-values.yaml --wait --timeout 3m
          kubectl exec deploy/takt -- /takt domain register --domain default
          kubectl exec deploy/takt -- /takt domain describe --domain default
      - name: Install chart with embedded NATS
        run: |
          helm upgrade takt charts/takt -f charts/takt/ci/kind-values.yaml \
            --set embeddedNats.enabled=true,replicaCount=1 --wait --timeout 3m
          kubectl exec deploy/takt -- /takt domain register --domain default
      - name: Debug
        if: failure()
        run: |
          kubectl get pods -A
          kubectl describe pods -l app.kubernetes.io/name=takt
          kubectl logs -l app.kubernetes.io/name=takt --tail=100
